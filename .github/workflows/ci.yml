# Check the code and build the style study.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    name: Lint, test, and build the style study
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the Python environment
        run: uv sync --locked

      - name: Check the code style
        run: make lint

      - name: Run the tests
        run: make test

      - name: Restore the open data files
        uses: actions/cache@v6
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('research/corpus.sha256') }}

      - name: Build the style study
        run: make study

      - name: Make sure that the committed tables and report are current
        run: git diff --exit-code -- research/measured docs/style-study.md

      - name: Upload the style study
        uses: actions/upload-artifact@v7
        with:
          name: style-study
          path: |
            docs/style-study.md
            research/measured/
            research/tables/
            research/sources.csv
          if-no-files-found: error
