# Night Music for Orchestra: design brief.
#
# This file records the decisions of the owner of the project.
# The design code and the composition code read this file.
# Do not change a decision in this file without the agreement of the owner.

[work]
title = "Night Music for Orchestra"
form = "one arch in five linked parts"
duration_minutes = 30
programme = "none"  # No titles for the time of night. No region tied to a part.
ending = "full orchestra on D major, fff"
decided = 2026-11-15

[style]
sources = [
    "Schoenberg, primarily Verklärte Nacht",
    "Bartók, primarily the night music style",
    "Corigliano",
]
profiles = "research/tables/profiles.csv"
# The work is a modern piece. It uses the sources; it does not copy them.

[orchestra]
size = "large plus colours"
winds = "triple, with auxiliary instruments"
auxiliaries = ["piccolo", "alto flute", "English horn", "E-flat clarinet", "bass clarinet", "contrabass clarinet", "contrabassoon"]
horns = "4 to 6"
percussion_players = "6"  # Decision of 2026-11-15 (second version). Before: "4 to 5".
percussion_colours = ["tuned gongs", "singing bowls"]
keyboards_and_harp = ["harp", "celesta", "piano"]
colours = ["cimbalom", "accordion", "mandolin", "ocarinas"]
# Four wind players play the ocarinas.
# No free sample library for the cimbalom is known. The audio stage must find one or use a substitute.

[world]
traditions = [
    "Carpathian and Balkan",
    "Arab maqam and the night call",
    "Hindustani night ragas",
    "Javanese gamelan and Japanese gagaku",
]
role = "voices of the night, used freely in all parts"
rule = "Use the processes and the colours of a tradition. Do not quote its melodies. Research each tradition before use."

[licence]
music_and_documents = "CC BY 4.0"
code = "MIT"

[deliverables]
score = "conductor score"
parts = "one part for each player"
audio = "realistic audio from free sample libraries"
video = "score video with part tracking"
build = "CI builds all assets"

[audio]
# Decision of 2026-11-15: all audio must have excellent equalization.
equalization = "excellent, at three levels: each instrument, each section, and the full mix"
reference = "Measure the tone balance of real orchestra recordings. Use it as the target for the mix."

# Decisions of the owner for the second version of the work (2026-11-15).
# The owner listened to the first Muse Sounds master and gave these three items.
[second_version]
natural_sound = "The instruments must have more natural attacks and decays."
heavy_section = "A heavy rhythmic section. The owner selected: in part 2, at the end of the chase; its rhythm comes back in part 5 in D major."
climax_percussion = "More percussion in the climax sections. The owner selected: six percussion players, with snare drum, tom-toms, and taiko."

# Decisions of the owner for the third version of the work (2026-11-15).
# The owner: the piece "has good bones", but "it is missing aspects of modern writing".
# The second edition of the style study gives the research and the measured values.
[third_version]
repetition = "Do not repeat the same idea two times with almost no change."
instruments = "Explore the instruments more."
non_chord_tones = "Use more notes outside the chords, where they give character and do not distract from a phrase."
harmony = "Strong colour: notes outside the chord, added notes, and passing chords in the bright half; polychords and chords of twelve notes from two interval types at the two climaxes; the last chord keeps added notes."
techniques = "Score first: write the techniques that serve the music. The audio uses the nearest sound that it has. A table lists each approximation."
free_rhythm = "Exact notation: each player has a written figure with its own length. No boxes."
devices = ["colour processes (one chord or line in changing instruments; heterophony)", "living textures (micropolyphony; climax chords from two interval types)", "time devices (tempo modulation; phrases of unequal length; sections that overlap; written accelerations)"]
not_selected = ["space (antiphonal violins; distant players)"]

# More decisions of the owner for the third version (2026-11-15, a later message).
[third_version_additions]
piano_interlude = "An interlude with the piano as its focus. It can add 5 to 6 minutes. It is across the turn: it starts in the night music of part 3, and it ends at the turn to D major."
piano_interlude_first_form = "The owner rejected the first form (slow and soft, with a soft halo of the orchestra): the interlude must be virtuosic, almost a small piano concerto. It must give energy and direction to the work, and it must have a function in the form."
piano_interlude_character = "The owner selected: a toccata and a cadenza."
piano_interlude_turn = "The owner selected: a loud peak, then a sudden soft arrival in D major. The motion of the piano does not stop."
piano_sound = "A better piano sound, or a better mix of the piano."
themes = "Do not show the theme too frequently. Sometimes change the theme or hide it."
high_strings = "The strings can sometimes be in their highest register."
trades = "When the music is intense, the woodwinds and the strings can trade fast figures (sixteenth notes, short groups of thirty-second notes), especially immediately before a transition with a strong stroke of the bass drum. This keeps the texture interesting when the theme repeats."
main_climax = "At the main climax, the gongs and the bass drum play on beats 2 and 4."
silent_instrument = "The instrument at the mark G had no sound."
brass_sound = "The loud brass must not sound as a 'splat' that cuts against the texture. The sound must have the balance of an orchestra."
telephone_video = "A version of the score video that is readable on a telephone (not the landscape format)."
violin_octave = "At a peak of a lush violin line, one time or two times, the line must not step down: it must go up one octave and sing."
ending_sparkle = "The ending must sparkle: crotales, chimes, and other bright instruments."

# Decisions that the composer's assistant made while the owner was not available
# (night of 2026-11-15). The owner must examine each decision. Each decision is
# easy to change.
[pending_review]
score_pitch = "The conductor score is in C. The parts are transposed."
score_language = "Italian tempo words and standard abbreviations."
seating = "First violins on the left, second violins on the right."
horns = "6 horns."
publication = "CI publishes each build as the GitHub release 'latest' (a prerelease)."
commit_address = "The commits use the GitHub no-reply address of the owner."
video_format = "1920 x 1080, 30 frames in a second, H.264 with AAC audio."
cimbalom_audio = "No free cimbalom samples exist. The audio uses Hungarian zither samples."
accordion_audio = "No free accordion samples are known. The audio uses harmonica samples."
contrabass_clarinet_audio = "The audio uses bass clarinet samples at a lower pitch."
e_flat_clarinet_audio = "The audio uses the samples of the clarinet in B-flat."
tuned_gongs_audio = "The audio uses tubular bell samples."
length = "The work has 513 bars and 31.2 minutes."
fermatas = "A fermata at the end of parts 1 to 4 adds 3 seconds. The fermata of the last chord adds 5 seconds."
heavy_section_place = "The heavy section is at the mark M (32 bars in 7/8, then the hammer strokes). In part 5 it is at the mark JJ, in place of the calls of the brass."
percussion_changes = "Each percussion player has 4 seconds or more for a change of instrument. The check of the work makes sure of this."
note_shapes = "For the audio only: a note of an instrument that rings continues for its ring time, and a soft long note before a rest becomes softer at its end."
rehearsal_marks = "Letters A to Z without I, then AA to GG."
quarter_tones = "Part 3 (alto flute, one cello) and part 5 (partials 11 and 13) have quarter-tones."
master_equalization = "The master gets the tone balance of five real orchestra recordings (not more than 6 dB of change in one band)."
master_loudness_range = "Gain riding gives the master a loudness range of 20 LU. The reference recordings have 14 to 24 LU."
master_loudness = "The integrated loudness is -20 LUFS, if the largest sample stays below -1 dBFS."
score_layout = "The code selects the system breaks of the score from the number of notes in each bar."
ocarinas = "Three players have an ocarina (oboe 2, clarinet 1, bassoon 2). The contrabass clarinet player has no ocarina."
audio_source = "The owner selected MuseScore Studio with Muse Sounds for the audio (2026-11-15). The open sample render stays as the source of the build server."
audio_release = "The computer of the owner puts the audio master in the release 'audio'. The build uses it if it is for the music of the commit."
playback_marks = "For the audio only: each note gets the dynamic mark and the articulation of Muse Sounds whose measured level agrees with an even scale of dynamic marks. The score does not change."
mark_g = "At the mark G, the chase starts at mp, not at pp."
brass_tone = "For the audio only: the brass is less bright at the written marks f, ff, and fff (8, 6, and 4 dB less above 2 kHz). Muse Sounds play these three marks with almost the same hard sound. Where all brass players hold loud chords, the level of the brass goes down slowly (3 dB or less)."
mix_equalization = "For the audio only: the mix gets three small filters (2 dB less at 170 Hz, 2 dB more at 2 kHz, 4 dB less above 6 kHz). The values come from a comparison of its loud passages with five recordings of real orchestras."
telephone_video_format = "1080 x 1920, tall pages, less music on each screen, and a ribbon of four rows."
