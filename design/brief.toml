# Night Music for Orchestra: design brief.
#
# This file records the decisions of the owner of the project.
# The design code and the composition code read this file.
# Do not change a decision in this file without the agreement of the owner.

[work]
title = "Night Music for Orchestra"
form = "one arch in five linked parts"
duration_minutes = 30
programme = "none"  # No titles for the time of night. No region tied to a part.
ending = "full orchestra on D major, fff"
decided = 2026-11-15

[style]
sources = [
    "Schoenberg, primarily Verklärte Nacht",
    "Bartók, primarily the night music style",
    "Corigliano",
]
profiles = "research/tables/profiles.csv"
# The work is a modern piece. It uses the sources; it does not copy them.

[orchestra]
size = "large plus colours"
winds = "triple, with auxiliary instruments"
auxiliaries = ["piccolo", "alto flute", "English horn", "E-flat clarinet", "bass clarinet", "contrabass clarinet", "contrabassoon"]
horns = "4 to 6"
percussion_players = "4 to 5"
percussion_colours = ["tuned gongs", "singing bowls"]
keyboards_and_harp = ["harp", "celesta", "piano"]
colours = ["cimbalom", "accordion", "mandolin", "ocarinas"]
# Four wind players play the ocarinas.
# No free sample library for the cimbalom is known. The audio stage must find one or use a substitute.

[world]
traditions = [
    "Carpathian and Balkan",
    "Arab maqam and the night call",
    "Hindustani night ragas",
    "Javanese gamelan and Japanese gagaku",
]
role = "voices of the night, used freely in all parts"
rule = "Use the processes and the colours of a tradition. Do not quote its melodies. Research each tradition before use."

[licence]
music_and_documents = "CC BY 4.0"
code = "MIT"

[deliverables]
score = "conductor score"
parts = "one part for each player"
audio = "realistic audio from free sample libraries"
video = "score video with part tracking"
build = "CI builds all assets"

[audio]
# Decision of 2026-11-15: all audio must have excellent equalization.
equalization = "excellent, at three levels: each instrument, each section, and the full mix"
reference = "Measure the tone balance of real orchestra recordings. Use it as the target for the mix."

# Decisions that the composer's assistant made while the owner was not available
# (night of 2026-11-15). The owner must examine each decision. Each decision is
# easy to change.
[pending_review]
score_pitch = "The conductor score is in C. The parts are transposed."
score_language = "Italian tempo words and standard abbreviations."
seating = "First violins on the left, second violins on the right."
horns = "6 horns."
publication = "CI publishes each build as the GitHub release 'latest' (a prerelease)."
commit_address = "The commits use the GitHub no-reply address of the owner."
video_format = "1920 x 1080, 30 frames in a second, H.264 with AAC audio."
cimbalom_audio = "No free cimbalom samples exist. The audio uses Hungarian zither samples."
accordion_audio = "No free accordion samples are known. The audio uses harmonica samples."
contrabass_clarinet_audio = "The audio uses bass clarinet samples at a lower pitch."
e_flat_clarinet_audio = "The audio uses the samples of the clarinet in B-flat."
tuned_gongs_audio = "The audio uses tubular bell samples."
length = "The work has 457 bars and 29.9 minutes."
rehearsal_marks = "Letters A to Z without I, then AA to GG."
quarter_tones = "Part 3 (alto flute, one cello) and part 5 (partials 11 and 13) have quarter-tones."
master_equalization = "The master gets the tone balance of five real orchestra recordings (not more than 6 dB of change in one band)."
master_loudness_range = "Gain riding gives the master a loudness range of 20 LU. The reference recordings have 14 to 24 LU."
master_loudness = "The integrated loudness is -20 LUFS, if the largest sample stays below -1 dBFS."
score_layout = "The code selects the system breaks of the score from the number of notes in each bar."
