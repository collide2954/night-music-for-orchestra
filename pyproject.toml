[project]
name = "nightmusic"
version = "0.1.0"
description = "Night Music for Orchestra: a programmed orchestral work, with its style study, score, audio, and video tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3",
]

[project.scripts]
nightmusic-study = "nightmusic.study.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightmusic"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
